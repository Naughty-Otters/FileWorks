services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fileworks
      POSTGRES_PASSWORD: fileworks
      POSTGRES_DB: fileworks
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fileworks -d fileworks"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
    image: fileworks-backend:local
    pull_policy: never
    command: ["/var/task/.venv/bin/python", "-m", "app"]
    environment:
      PORT: "8000"
      DATABASE_URL: postgresql+psycopg://fileworks:fileworks@db:5432/fileworks
      JWT_SECRET: ${JWT_SECRET:-dev-insecure-change-me}
      STORAGE_BACKEND: local
      STORAGE_LOCAL_ROOT: /tmp/history
      UPLOAD_DIR: /tmp/uploads
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      PUBLIC_APP_URL: http://localhost:3000
      PADDLE_DEVICE: cpu
      PADDLE_OCR_ENABLED: "false"
      OCR_ENGINE: ocr
      # Linux containers on Apple Silicon need this — Paddle segfaults above ~1296 px.
      OCR_PLATFORM_MAX_INPUT_SIDE: "1200"
      LITEPARSE_ENABLED: "true"
      LITEPARSE_USE_PADDLE_OCR: "true"
      HOME: /tmp
      DOCLING_ARTIFACTS_PATH: /var/task/.cache/docling/models
      HF_HOME: /var/task/.cache/huggingface
      EASYOCR_MODEL_DIR: /var/task/.cache/easyocr
      PADDLE_PDX_CACHE_HOME: /var/task/.cache/paddlex
      PYTHONUNBUFFERED: "1"
    env_file:
      - path: backend/.env
        required: false
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - backend_data:/tmp
      - ./backend/app:/var/task/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: fileworks-frontend:local
    pull_policy: never
    environment:
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-1063086817026-33rehu3tmsg08gll6dc9jue97000ib8f.apps.googleusercontent.com}
      API_PROXY_TARGET: http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    # Named volume hides image node_modules; npm install picks up package.json changes.
    command:
      [
        "sh",
        "-c",
        "npm install && rm -rf .next && npm run dev -- --hostname 0.0.0.0 --port 3000 --webpack",
      ]

volumes:
  pgdata:
  backend_data:
  frontend_node_modules:
