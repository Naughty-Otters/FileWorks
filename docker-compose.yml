services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fileworks
      POSTGRES_PASSWORD: fileworks
      POSTGRES_DB: fileworks
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fileworks -d fileworks"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      DATABASE_URL: postgresql+psycopg://fileworks:fileworks@db:5432/fileworks
      JWT_SECRET: ${JWT_SECRET:-dev-insecure-change-me}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      STORAGE_BACKEND: local
      STORAGE_LOCAL_ROOT: /tmp/history
      UPLOAD_DIR: /tmp/uploads
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      PADDLE_DEVICE: cpu
      OCR_ENGINE: ocr
      HOME: /tmp
    env_file:
      - path: backend/.env
        required: false
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - backend_data:/tmp
      - ./backend/app:/var/task/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      API_PROXY_TARGET: http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    command: ["sh", "-c", "npm install && npm run dev -- --hostname 0.0.0.0 --port 3000"]
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

volumes:
  pgdata:
  backend_data:
  frontend_node_modules:
