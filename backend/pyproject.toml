[project]
name = "fileworks-api"
version = "0.1.0"
description = "FileWorks — convert and transform any file format"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    "pydantic-settings>=2.6.0",
    "aiofiles>=24.1.0",
    "pillow>=11.0.0",
    "paddleocr>=3.0.0",
    "paddlepaddle==3.3.0",
    "paddlex[ocr]>=3.7.0",
    "firecrawl-anydoc>=0.1.8",
    "markdown>=3.7.0",
    "httpx>=0.27.0",
    "pypdfium2>=4.30.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.3.0",
    "langchain-anthropic>=0.3.0",
    "langchain-deepseek>=1.1.0",
    "langchain-fireworks>=1.5.2",
    "langchain-xai>=1.3.0",
    "langchain-openrouter>=0.2.7",
    "langchain-moonshot>=0.1.0",
    "boto3>=1.35.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "psycopg[binary]>=3.2.0",
    "PyJWT>=2.9.0",
    "google-auth>=2.36.0",
    "awslambdaric>=3.0.0",
]

[project.scripts]
fileworks-db = "app.db.upgrade:main"

[[tool.uv.index]]
name = "paddle"
url = "https://www.paddlepaddle.org.cn/packages/stable/cpu/"
explicit = true

[tool.uv.sources]
paddlepaddle = { index = "paddle" }

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
source = ["app"]
omit = [
    "app/db/migrations/*",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
